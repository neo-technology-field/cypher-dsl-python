# Build the documentation and publish it to GitHub Pages.
#
# The build is the same Nox session the checks run, so a warning fails the deployment
# instead of publishing a page the strict build rejects.
#
# Action pins resolve to commits of the versions verified while adding this workflow:
#   actions/checkout@v7.0.1               -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-python@v7.1.0           -> 6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
#   astral-sh/setup-uv@v10.3.3            -> 68559e99cc807c1eb7e9238fd43a15bba460eec2
#   actions/upload-pages-artifact@v5.0.0  -> fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages@v5.0.1           -> 368f82528645a54fb793d4d04e342629a3f51346
# Resolved on 2026-11-16 through the GitHub REST API; annotated tags were dereferenced
# before recording. Do not replace them with unverified future tags.

name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install the newest supported Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Build the documentation
        run: uv run --frozen nox -s docs
      - name: Package the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
